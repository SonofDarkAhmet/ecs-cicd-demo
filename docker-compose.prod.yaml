name: mern-app-prod
services:
  # databases:
  #   container_name: mongoapp
  #   image: mongo:8.0.3
  #   volumes:
  #     - mongodbdata:/data/db
  #   env_file:
  #     - ./env/mongo.env
  #   networks:
  #     - db-net
  apps:
    container_name: nodeapp
    build: 
      context: ./API-jokes
      dockerfile: Dockerfile.prod
    image: node-api-image
    ports:
      - "5000:5000"
    # depends_on:
    #   - databases
    env_file:
      - ./env/server.prod.env
    networks:
      # - db-net
      - server-net

  client:
    container_name: reactapp
    build: 
      context: ./react-client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: http://localhost:5000
    image: react-client-image
    ports:
      - "80:80"
    depends_on:
      - apps
    networks:
      - server-net

# volumes:
