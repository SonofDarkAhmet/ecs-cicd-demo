name: Build image and deploy to ECS
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  NODE_IMAGE_NAME: ecs-aws-demo
  REACT_IMAGE_NAME: ecs-aws-react-demo
  AWS-REGION: eu-north-1
jobs:
  build-image-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Add details to image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/${{ env.NODE_IMAGE_NAME }}
          tags: |
            latest
            v1.0.${{ github.run_number }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./API-jokes
          file: ./API-jokes/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  build-image-react:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Add details to image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_USERNAME }}/${{ env.REACT_IMAGE_NAME }}
          tags: |
            latest
            v1.0.${{ github.run_number }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./react-client
          file: ./react-client/Dockerfile.prod
          build-args: |
            VITE_API_BASE_URL=http://ECS-LoadBalancer-232098305.eu-north-1.elb.amazonaws.com
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  deploy-to-ecs:
    needs:
      - build-image-node
      - build-image-react
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS-REGION }}
