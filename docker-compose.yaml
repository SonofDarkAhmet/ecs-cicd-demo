name: mern-app
services:
  databases:
    container_name: mongoapp
    image: mongo:8.0.3
    volumes:
      - mongodbdata:/data/db
    env_file:
      - ./env/mongo.env
    networks:
      - db-net
  apps:
    container_name: nodeapp
    build: 
      context: ./API-jokes
      dockerfile: Dockerfile
    image: node-api-image
    ports:
      - "5000:5000"
    depends_on:
      - databases
    env_file:
      - ./env/server.env
    networks:
      - db-net
      - server-net
    develop:
      watch:
        - path: ./API-jokes
          action: sync
          target: /app
          ignore:
            - node_modules 
  client:
    stdin_open: true
    tty: true
    container_name: reactapp
    build: 
      context: ./react-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    image: react-client-image
    ports:
      - "3000:3000"
    depends_on:
      - apps
    networks:
      - server-net
    develop:
      watch:
        - path: ./react-client
          action: sync
          target: /app
          ignore:
            - node_modules 
            - dist
volumes:
  mongodbdata:
networks:
  db-net:
  server-net:
  